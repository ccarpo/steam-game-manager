services:
  steam-game-manager:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "50068:3000"
    volumes:
      - /media/veracrypt3/steamgamemanager:/app/data
    restart: unless-stopped
    environment:
      - AUTH_SECRET=${AUTH_SECRET:?Set AUTH_SECRET in a .env file or your shell. Use a long random string.}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
